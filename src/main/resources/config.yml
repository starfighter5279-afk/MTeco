# ============================================================
#                  MTeco — Core Configuration
# ============================================================
# General plugin settings for characters, families, and combat.
# Module configs are split into their own files:
#   discord.yml   — Discord bot integration
#   nations.yml   — Nations, war, minters, enforcers, laws, crime
#   business.yml  — Business & payroll system
#   shops.yml     — Player shop system
#   roles.yml     — Elite role permissions
#
# Use /mteco reload to apply changes without restarting.
# ============================================================

# ────────────────────────────
#   Character System
# ────────────────────────────
character:
  # Cost to change your character's name (set to 0 for free)
  name-change-cost: 100000.0

  # Ticks to wait before opening character creation after death (20 ticks = 1 second)
  death-respawn-delay-ticks: 10

  # Ticks to wait after player joins before checking character status
  join-delay-ticks: 20

  # Daily login reward amount (set to 0 to disable)
  daily-login-reward: 500.0

# ────────────────────────────
#   Family System
# ────────────────────────────
family:
  # Set to false to disable marriage, divorce, and children entirely
  enabled: true

  # Cost to send a marriage request
  marriage-cost: 1000.0

  # Payout to the spouse when filing for divorce
  divorce-payout: 1000.0

  # Minimum days a character must exist before they can marry
  marriage-eligibility-days: 30

# ────────────────────────────
#   MTHands (Physical Combat)
# ────────────────────────────
mthands:
  # Set to false to disable the MTHands combat listener
  enabled: true

# ────────────────────────────
#   Contracts
# ────────────────────────────
contracts:
  # Set to false to disable the contract system entirely
  enabled: true

  # Cost to obtain a paper copy of a signed contract
  paper-copy-cost: 500.0