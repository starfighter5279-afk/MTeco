# ============================================================
#               MTeco — Discord Integration
# ============================================================
# Links character mailboxes to Discord so players receive
# notifications as DMs. Players can also manage wars, families,
# and announcements from Discord slash commands.
#
# ─── Setup Guide ───
# 1) Create a bot at https://discord.com/developers/applications
# 2) Go to Bot tab → enable MESSAGE CONTENT INTENT
# 3) Paste your bot token below and set enabled: true
# 4) Go to OAuth2 → URL Generator
#    Scopes: bot, applications.commands
#    Permissions: Send Messages, Use Slash Commands, Embed Links
# 5) Open the generated URL to invite the bot to your server
# 6) Set guild-id to your Discord server ID (for instant slash commands)
# 7) In-game: /mteco link → player receives a 6-digit code
# 8) On Discord: player sends the code in the link channel or DMs the bot
# ============================================================

# Master toggle — set to true to enable the Discord bot
enabled: false

# Bot token from the Discord Developer Portal
bot-token: "YOUR_BOT_TOKEN_HERE"

# Your Discord server (guild) ID
# Required for slash commands to register instantly
# Right-click server name → Copy Server ID (enable Developer Mode first)
guild-id: ""

# Channel ID where players can type their link codes
# Leave empty to only allow linking via DMs to the bot
link-channel-id: ""

# ────────────────────────────
#   Discord Role Sync
# ────────────────────────────

# Automatically create Discord roles for every custom nation role.
# Format: "<nation name>, <role name>" using the nation's primary color.
# Roles are kept in sync when created, renamed, or deleted in-game.
role-discord-permissions: false

# ────────────────────────────
#   Discord Nickname Sync
# ────────────────────────────

# Set each linked player's Discord nickname to their Minetropolis
# character name. Updated on link and every reload.
discord-mtc-name: false

# ────────────────────────────
#   Proximity Voice Chat
# ────────────────────────────

# Proximity-based voice chat through Discord.
# Players join the specified voice channel to enter the system.
# Sub-channels are created automatically to group players within
# range of each other. Players out of range are server-muted.
#
# Note: Discord API does not support per-user volume control from
# bots. Proximity is handled by grouping nearby players into shared
# sub-channels (hear each other) and muting isolated players.
#
# Tip: Ask players to enable Discord Streamer Mode
# (Settings → Streamer Mode → Enable) to suppress join/leave/mute
# notification sounds during automatic channel switches.
proximity:
  enabled: false

  # The voice channel ID players join to enter proximity chat.
  # This acts as the lobby — players are moved to sub-channels
  # automatically when near other players.
  voice-channel-id: ""

  # Category where sub-channels are created.
  # Leave empty to use the lobby channel's parent category.
  sub-channel-category-id: ""

  # Maximum distance (in blocks) for players to hear each other.
  radius: 50

  # How often to update proximity groups (in ticks, 20 = 1 second).
  update-interval-ticks: 20

  # ── Proximity Text Chat ──
  # When enabled, regular chat messages only reach players
  # within the configured radius.
  text-chat:
    enabled: false
    radius: 50

# ────────────────────────────
#   Auto-Link
# ────────────────────────────

# Automatically link Minecraft and Discord accounts when a player
# joins the server. Matches the Minecraft username against Discord
# guild members' username, nickname, and display name.
# If a match is found and neither account is already linked, the
# accounts are linked automatically — no code required.
auto-link: true

# ────────────────────────────
#   Chat Bridge
# ────────────────────────────

# Relay messages between a Discord text channel and in-game chat.
# Messages from Minecraft appear in Discord with the character name.
# Messages from Discord appear in-game with a [Discord] prefix.
chat-bridge:
  enabled: false
  channel-id: ""

# ────────────────────────────
#   Activity Feed
# ────────────────────────────

# Posts server events to a Discord channel as rich embed notifications.
# Events include: war declarations, surrenders, payments, auto-links,
# and bot status changes.
activity-feed:
  enabled: false
  channel-id: ""