name: DirtEconomy
main: com.dirt.DirtEconomy
version: 1.0
author: HimnerdMC
api-version: '1.21'
folia-supported: true
soft-depend: [Vault, DirtNations, BlueMap, floodgate, Essentials]
permissions:
  dirt.admin:
    description: Access admin character commands
    default: op
  dirt.reload:
    description: Reload DirtEconomy configuration
    default: op
  DirtNations.admin:
    description: Access nation admin commands
    default: op
commands:
  d:
    description: DirtEconomy admin commands
    usage: /d reload
    permission: dirt.reload
    aliases: [dirt]
  dc:
    description: Character management
    usage: /dc [create|bal|admin]
    aliases: [dirtc, character, char]
  did:
    description: View character ID cards
    usage: /did [view <player>]
    aliases: [dirtid, id]
  dn:
    description: Nation management
    usage: /dn [subcommand]
    aliases: [dirtn, nation]
  dr:
    description: Region management
    usage: /dr [claim|auto]
    aliases: [dirtr, region]
  db:
    description: Business management
    usage: /db [view]
    aliases: [dirtb, business, biz]
  ds:
    description: Shop management
    usage: /ds [online|top]
    aliases: [dirts, shop, shops]
  laws:
    description: View your nation's law books
    usage: /laws view
  sethome:
    description: Set your home waypoint
    usage: /sethome
  home:
    description: Teleport to your home waypoint
    usage: /home
  gps:
    description: GPS navigation system
    usage: /gps <location> [details]
    aliases: [navigate]
  setgps:
    description: Create a GPS location
    usage: /setgps <name> | /setgps business <business>
  give:
    description: Admin give command
    usage: /give <phone|life_token> <player> [amount]
    permission: dirt.admin